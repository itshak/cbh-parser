name: 🐛 Bug Report
description: Report a parsing, decoding, replay or archive bug in cbvault.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in cbvault!
  - type: input
    id: version
    attributes:
      label: cbvault Version / Commit
      placeholder: e.g. 0.1.0 or main @ commit hash
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database (file name and version)
      description: Which ChessBase database and version did you read? Small anonymised excerpts are fine.
      placeholder: e.g. Mega Database 2025, or a .cbh built by cbvault-format tests
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction (Code / FEN / Move List)
      description: Please provide Rust code or the smallest input that reproduces the issue.
      placeholder: |
        use cbvault::bridge::Database;

        let db = Database::open("db.cbh")?;
        // ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect the read, replay or export to produce?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred (panic, wrong move list, wrong export, hang)?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Platform and Rust version
      description: OS, architecture, `rustc --version`, and the cbvault crates involved.
      placeholder: macOS 15 arm64, rustc 1.98.0, cbvault-format 0.1.0